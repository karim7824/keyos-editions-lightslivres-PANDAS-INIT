<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>Initiation à la programmation avec pandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Dimensions strictes du format A4 au ratio standardisé */
      --w:        210mm;
      --h:        297mm;
      --bg:       #0A1120;  /* Fond sombre Tech */
      --blue:     #38BDF8;  /* Cyan Tech */
      --pink:     #F43F5E;  /* Rose néon */
      --white:    #F8FAFC;
      --mid:      #94A3B8;
      --couleurdetrait: yellow;
      --f-title:  'Bebas Neue', sans-serif;
      --f-body:   'DM Sans', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #111111;
      font-family: var(--f-body);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Conteneur principal simulant la feuille A4 */
    .page-a4 {
      position: relative;
      width: var(--w);
      height: var(--h);
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40mm 25mm 25mm 25mm; /* Marges d'impression standard */
    }

    /* Grille et effets Tech en arrière-plan */
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 1;
    }

    .page-a4::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle 500px at 50% 20%, rgba(56, 189, 248, 0.12), transparent),
        radial-gradient(circle 400px at 80% 80%, rgba(244, 63, 94, 0.06), transparent);
      z-index: 1;
    }

    .content-top, .content-middle, .content-bottom {
      position: relative;
      z-index: 2;
    }

    /* Section Haute : Société et Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.06);
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--blue);
    }

    /* Section Centrale : Titre, Sous-titre et Résumé */
    .header-main {
      margin-top: 20mm;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .title {
      font-family: var(--f-title);
      font-size: 5.5rem;
      line-height: 0.9;
      letter-spacing: .01em;
      color: var(--white);
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--blue);
      line-height: 1.3;
      max-width: 90%;
    }

    .sep {
      width: 100%;
      height: 4px;
      /*background: linear-gradient(90deg, var(--blue), var(--pink));*/
      background: var(--couleurdetrait);
      border-radius: 999px;
      margin: 15px 0 25px 0;
    }

    .abstract-box {
      background: rgba(255, 255, 255, 0.01);
      border-left: 3px solid var(--pink);
      padding: 20px;
      max-width: 85%;
      margin-top: 10mm;
    }

    .abstract-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--mid);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .abstract-text {
      font-size: 1.05rem;
      color: var(--white);
      line-height: 1.6;
      font-weight: 300;
    }

    /* Section Basse : Métadonnées (Auteur, Date...) */
    .meta-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 20px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--mid);
    }

    .meta-value {
      font-size: .8rem;
      font-weight: 500;
      color: var(--white);
    }

    /* Filigrane de l'année */
    .watermark-year {
      position: absolute;
      bottom: -10mm;
      right: -5mm;
      font-family: var(--f-title);
      font-size: 16rem;
      color: rgba(255, 255, 255, 0.015);
      user-select: none;
      z-index: 1;
    }
  </style>
</head>
<body>

<div class="page-a4">
  <div class="grid"></div>
  
  <div class="content-top">
    <div class="badge">🏢 Keyos editions</div>
  </div>

  <div class="content-middle">
    <div class="header-main">
      <h1 class="title">Initiation à la programmation avec pandas</h1>
      <div class="subtitle">Comprendre et mettre en oeuvre la syntaxe de pandas</div>
      <div class="sep"></div>
    </div>

    <div class="abstract-box">
      <div class="abstract-title">Résumé</div>
      <div class="abstract-text">Ce support présente l'essentiel des concepts à propos de pandas</div>
    </div>
  </div>

  <div class="content-bottom">
    <div class="meta-grid">
      <div class="meta-item">
        <span class="meta-label">Auteur</span>
        <span class="meta-value">Belhadj Karim</span>
      </div>
      <div class="meta-item" style="text-align: right;">
        <span class="meta-label">Date de publication</span>
        <span class="meta-value">06/07/2026</span>
      </div>
    </div>
  </div>

  <div class="watermark-year">2026</div>
</div>

</body>
</html>
